[[language]]
name = "php"
scope = "source.php"
injection-regex = "php"
file-types = ["php"]
shebangs = ["php"]
# roots = ["composer.json", "index.php"]
comment-token = "//"
indent = { tab-width = 4, unit = "    " }
language-servers = [{name = "phpactor", except-features = ["format"] }]

[language-server.phpactor]
command = "phpactor"
args = [ "language-server" ]

[[language]]
name = "json"
formatter = { command = 'prettier', args = ["--parser", "json"] }
auto-format = true

[[language]]
name = "markdown"
formatter = { command = 'prettier', args = ["--parser", "markdown"] }
auto-format = true

[[language]]
name = "yaml"
formatter = { command = "dprint", args = ["fmt", "--stdin", "yaml"] }
auto-format = true
